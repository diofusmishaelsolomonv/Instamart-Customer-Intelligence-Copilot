name: Reproducible project validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Check Python syntax
        run: |
          python -m py_compile generate_data.py mock_llm.py run_all.py validate_data.py src/part_a.py src/part_b.py src/part_c.py src/part_d.py

      - name: Generate deterministic synthetic data
        run: python generate_data.py

      - name: Run Parts A-D
        run: python run_all.py

      - name: Validate clean-data checkpoints
        run: python validate_data.py

      - name: Verify expected deliverables
        run: |
          python - <<'PY'
          import csv, json
          from pathlib import Path

          root = Path(".")
          required = [
              "data/raw/customers.csv", "data/raw/products.csv",
              "data/raw/orders.csv", "data/raw/tickets.csv",
              "data/raw/policy_eval.csv", "data/raw/agent_scenarios.csv",
              "data/clean/customers.csv", "data/clean/products.csv",
              "data/clean/orders.csv", "data/instamart.db",
              "outputs/raw_audit.json", "outputs/part_a_cleaning_stats.json",
              "outputs/part_a_sql_summary.json", "outputs/rfm_summary.json",
              "outputs/segment_profiles.csv", "outputs/customer_segments.csv",
              "outputs/lapse_model_summary.json", "outputs/lapse_model.joblib",
              "outputs/triage_results.csv", "outputs/part_c_summary.json",
              "outputs/policy_eval_results.csv", "outputs/agent_runs.jsonl",
              "outputs/refund_ledger.jsonl", "outputs/part_d_summary.json",
          ]
          missing = [p for p in required if not (root / p).is_file() or (root / p).stat().st_size == 0]
          if missing:
              raise SystemExit("Missing/empty deliverables: " + ", ".join(missing))
          for name in ["raw_audit.json", "part_a_cleaning_stats.json",
                       "part_a_sql_summary.json", "rfm_summary.json",
                       "lapse_model_summary.json", "part_c_summary.json",
                       "part_d_summary.json"]:
              with (root / "outputs" / name).open(encoding="utf-8") as stream:
                  json.load(stream)
          for i in range(1, 8):
              path = root / "outputs" / f"q{i}_result.csv"
              if not path.is_file() or path.stat().st_size == 0:
                  raise SystemExit(f"Missing/empty SQL result: {path}")
              with path.open(newline="", encoding="utf-8") as stream:
                  if not next(csv.reader(stream), []):
                      raise SystemExit(f"SQL result has no header: {path}")
          print(f"Verified {len(required)} required deliverables, 7 SQL results, and 7 JSON summaries.")
          PY

      - name: Upload run outputs for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instamart-copilot-run-outputs
          path: |
            outputs/
            data/clean/
            data/raw/
            data/instamart.db
            state/
          if-no-files-found: warn
          retention-days: 14
